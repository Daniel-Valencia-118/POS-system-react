name: Mantener Supabase Despierto

on:
  schedule:
    # Se ejecuta a las 00:00 UTC los lunes, miércoles y viernes
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch: # Esto permite que lo pruebes manualmente con un botón

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Realizar consulta de actividad
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/p_active?select=*" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
          -H "Range: 0-0"
