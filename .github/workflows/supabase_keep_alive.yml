name: Mantener Supabase Despierto

on:
  schedule:
    # Se ejecuta a las 00:00 UTC los lunes (1) y jueves (4)
    - cron: '0 0 * * 1,4'
  workflow_dispatch: 

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Realizar consulta de actividad (POST)
        run: |
          curl -f -i -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
          -H "Content-Type: application/json" \
          -H "Prefer: return=minimal" \
          -d "{}"